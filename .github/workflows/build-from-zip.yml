name: Build APK & AAB dari ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Extract ZIP
        run: |
          unzip -o skysight-ar.zip -d extracted
          if [ -f extracted/package.json ]; then
            cp -a extracted/. .
          else
            SUB=$(dirname "$(find extracted -maxdepth 2 -name package.json | head -n 1)")
            cp -a "$SUB"/. .
          fi
          rm -rf extracted
      - name: Build Web & Android
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Generate Keystore & Build Release
        run: |
          KEYSTORE_FILE="$PWD/android/app/release-keystore.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias "bidik-release" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "bidik123456" -keypass "bidik123456" \
            -dname "CN=Ahmad Azizi, OU=Bidik, O=Al-Muqri, L=Prenduan Sumenep, ST=Jawa Timur, C=ID"
          cd android
          chmod +x gradlew
          ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE" \
          ANDROID_KEYSTORE_PASSWORD="bidik123456" \
          ANDROID_KEY_ALIAS="bidik-release" \
          ANDROID_KEY_PASSWORD="bidik123456" \
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Prepare Outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Bidik-v1.0-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Bidik-v1.0-release.aab
      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Bidik-Keystore-Backup
          path: android/app/release-keystore.jks
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0-build-${{ github.run_number }}" out/* \
            --title "Bidik v1.0 (Build ${{ github.run_number }})" \
            --notes "Build rilis APK dan AAB aplikasi Bidik."

name: Build APK & AAB dari ZIP

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Terbitkan APK & AAB ke GitHub Releases'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ekstrak file ZIP proyek
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file .zip di root repositori."
            exit 1
          fi
          echo "Mengekstrak: $ZIP_FILE"
          unzip -o "$ZIP_FILE"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate & konfigurasi proyek Android Bidik
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Siapkan keystore rilis
        id: keystore
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/android/app/release-keystore.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "bidik-release" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "bidik123456" \
              -keypass "bidik123456" \
              -dname "CN=Ahmad Azizi, OU=Bidik, O=Al-Muqri Prenduan, ST=Jawa Timur, C=ID"
          fi
          echo "keystore_path=$KEYSTORE_FILE" >> $GITHUB_OUTPUT

      - name: Build APK & AAB Release
        working-directory: android
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'bidik123456' }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'bidik-release' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bidik123456' }}

      - name: Siapkan file hasil build
        run: |
          mkdir -p release-outputs
          cp android/app/build/outputs/apk/release/app-release.apk release-outputs/Bidik-v1.0-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-outputs/Bidik-v1.0-release.aab

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Bidik-Release-APK
          path: release-outputs/Bidik-v1.0-release.apk

      - name: Upload Artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: Bidik-Release-AAB
          path: release-outputs/Bidik-v1.0-release.aab

      - name: Terbitkan ke GitHub Releases
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-build-${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            release-outputs/Bidik-v1.0-release.apk \
            release-outputs/Bidik-v1.0-release.aab \
            --title "Bidik $TAG_NAME" \
            --notes "Build otomatis APK & AAB aplikasi Bidik (Ahmad Azizi · Al-Muqri Prenduan)."

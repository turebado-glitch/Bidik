name: Build APK & AAB dari ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract ZIP
        run: |
          unzip -o skysight-ar.zip -d extracted_app
          cp -r extracted_app/. .
          rm -rf extracted_app

      - name: Build Web & Android
        run: |
          npm install --legacy-peer-deps
          if ! node -e "require.resolve('@capacitor/android')" 2>/dev/null; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi
          npm run build
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "Bidik" "com.ahmadazizi.bidik" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -f "scripts/configure-android.mjs" ]; then
            node scripts/configure-android.mjs
          fi
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Generate Keystore & Build Release
        working-directory: android
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias bidik-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bidik123456 \
            -keypass bidik123456 \
            -dname "CN=Ahmad Azizi, OU=Bidik, O=Al-Muqri, L=Prenduan Sumenep, ST=Jawa Timur, C=ID"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: bidik123456
          ANDROID_KEY_ALIAS: bidik-release
          ANDROID_KEY_PASSWORD: bidik123456

      - name: Prepare Outputs
        run: |
          mkdir -p release-outputs
          cp android/app/build/outputs/apk/release/*.apk release-outputs/Bidik-v1.0-release.apk
          cp android/app/build/outputs/bundle/release/*.aab release-outputs/Bidik-v1.0-release.aab

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Bidik-Keystore-Backup
          path: android/app/release-keystore.jks

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0-build-${{ github.run_number }}" \
            release-outputs/Bidik-v1.0-release.apk \
            release-outputs/Bidik-v1.0-release.aab \
            --title "Bidik v1.0 (Build ${{ github.run_number }})" \
            --notes "Build release APK & AAB aplikasi Bidik"
